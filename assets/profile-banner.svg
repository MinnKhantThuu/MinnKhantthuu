<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Minn Khant Thu — Flutter and Node.js Developer</title>
  <desc id="desc">A dark blue gradient banner introducing Minn Khant Thu, a Flutter and Node.js developer based in Bangkok.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="0.52" stop-color="#0D2845" />
      <stop offset="1" stop-color="#075985" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.34" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#BAE6FD" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)" />
  <rect width="1280" height="360" rx="28" fill="url(#grid)" />
  <circle cx="1080" cy="40" r="260" fill="url(#glow)" />
  <circle cx="120" cy="335" r="190" fill="url(#glow)" opacity="0.7" />

  <g opacity="0.75">
    <circle cx="1085" cy="85" r="61" fill="none" stroke="#7DD3FC" stroke-width="2" />
    <circle cx="1085" cy="85" r="85" fill="none" stroke="#7DD3FC" stroke-opacity="0.36" />
    <path d="M1037 82l30-30 21 21 45-45M1133 28v35h-35" fill="none" stroke="#E0F2FE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="92" y="132" fill="#7DD3FC" font-size="22" font-weight="700" letter-spacing="4">HELLO, I’M</text>
    <text x="88" y="205" fill="#F8FAFC" font-size="60" font-weight="800" letter-spacing="-1">Minn Khant Thu</text>
    <text x="92" y="258" fill="#CBD5E1" font-size="27" font-weight="500">Flutter &amp; Node.js Developer</text>
    <text x="92" y="305" fill="#94A3B8" font-size="19">Mobile apps · Backend APIs · Bangkok, Thailand</text>
  </g>
</svg>
