<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Minn Khant Thu — build mode</title>
  <desc id="desc">A terminal-inspired engineering dashboard showing Minn's role, focus, location, and product mindset.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070E1B" />
      <stop offset="0.55" stop-color="#0B1F35" />
      <stop offset="1" stop-color="#102B46" />
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.55" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#A78BFA" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity="0.045" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#background)" />
  <rect width="1200" height="380" rx="24" fill="url(#grid)" />
  <rect x="22" y="22" width="1156" height="336" rx="17" fill="none" stroke="#38BDF8" stroke-opacity="0.18" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g>
      <rect x="48" y="48" width="690" height="284" rx="14" fill="#050A13" fill-opacity="0.82" stroke="#334155" />
      <circle cx="78" cy="75" r="6" fill="#FB7185" />
      <circle cx="99" cy="75" r="6" fill="#FBBF24" />
      <circle cx="120" cy="75" r="6" fill="#4ADE80" />
      <text x="145" y="81" fill="#64748B" font-size="15">minn@build-mode: ~</text>

      <text x="76" y="128" fill="#22D3EE" font-size="18">$</text>
      <text x="100" y="128" fill="#E2E8F0" font-size="18">whoami</text>
      <text x="100" y="158" fill="#94A3B8" font-size="17">Senior Flutter developer • mobile + full stack</text>

      <text x="76" y="203" fill="#22D3EE" font-size="18">$</text>
      <text x="100" y="203" fill="#E2E8F0" font-size="18">focus --now</text>
      <text x="100" y="233" fill="#94A3B8" font-size="17">mobile • web • APIs • streaming systems</text>

      <text x="76" y="278" fill="#22D3EE" font-size="18">$</text>
      <text x="100" y="278" fill="#E2E8F0" font-size="18">principles</text>
      <text x="100" y="308" fill="#A78BFA" font-size="17">clarity &gt; complexity  •  usefulness &gt; novelty</text>
      <rect x="533" y="291" width="10" height="20" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>

    <g>
      <circle cx="805" cy="65" r="5" fill="#4ADE80" filter="url(#glow)" />
      <text x="820" y="71" fill="#4ADE80" font-size="15" font-weight="700" letter-spacing="1">SYSTEM ONLINE</text>

      <rect x="780" y="92" width="360" height="66" rx="11" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.35" />
      <text x="802" y="116" fill="#64748B" font-size="13" letter-spacing="2">MOBILE</text>
      <text x="802" y="142" fill="#E2E8F0" font-size="18" font-weight="700">Flutter + Dart</text>
      <circle cx="1108" cy="125" r="10" fill="#38BDF8" opacity="0.8" />

      <rect x="780" y="170" width="360" height="66" rx="11" fill="#0F2942" stroke="#818CF8" stroke-opacity="0.35" />
      <text x="802" y="194" fill="#64748B" font-size="13" letter-spacing="2">WEB + API</text>
      <text x="802" y="220" fill="#E2E8F0" font-size="18" font-weight="700">React + Node.js</text>
      <circle cx="1108" cy="203" r="10" fill="#818CF8" opacity="0.85" />

      <rect x="780" y="248" width="360" height="66" rx="11" fill="#0F2942" stroke="#C084FC" stroke-opacity="0.35" />
      <text x="802" y="272" fill="#64748B" font-size="13" letter-spacing="2">DELIVERY</text>
      <text x="802" y="298" fill="#E2E8F0" font-size="18" font-weight="700">Railway + CI/CD</text>
      <circle cx="1108" cy="281" r="10" fill="#C084FC" opacity="0.85" />
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="2" fill="url(#cyanViolet)" opacity="0.55">
    <animate attributeName="y" values="0;378;0" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.35;0" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>
