name: Generate contribution snake

on:
  schedule:
    - cron: "21 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/contribution-snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EBEDF0,#BAE6FD,#38BDF8,#8B5CF6,#EC4899
            assets/generated/contribution-snake-dark.svg?palette=github-dark&color_snake=#F8FAFC&color_dots=#161B22,#0EA5E9,#8B5CF6,#D946EF,#F43F5E

      - name: Commit refreshed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/contribution-snake-*.svg

          if git diff --cached --quiet; then
            echo "Contribution snake is already up to date."
            exit 0
          fi

          git commit -m "chore: refresh contribution snake"
          git push
